# Vector arm. Equal work + equal durability with the OTel Collector arm:
#   work        - every line is parsed as JSON, then enriched with the six
#                 operations listed below, then discarded
#   durability  - no event buffer on disk and no checkpoint: the file is re-read
#                 from the beginning on every run (read_from: beginning +
#                 ignore_checkpoints: true)
#
# The six operations mirror otel.yaml statement for statement. Each one is
# either a field defined by the OpenTelemetry logs data model, an attribute from
# the semantic convention registry, or a data-protection operation:
#
#   #  operation                target                            basis
#   1  event time               Timestamp                         Logs Data Model
#   2  severity from status     SeverityText / SeverityNumber     Data Model + RFC 9110 §15
#   3  four renames             http.request.method               semconv, Stable
#                               url.path                          semconv, Stable
#                               http.response.status_code         semconv, Stable
#                               network.protocol.version          semconv, Stable
#   4  client address           client.address                    semconv, Stable
#   5  PII removal              (drops user-identifier)           GDPR Art. 5(1)(c)
#   6  static context           service.name                      semconv, Stable+Required
#                               deployment.environment.name       semconv, Stable
#
# Operation 0 (processed) is a benchmark-internal marker, not a production
# attribute; it is disclosed and excluded from the standardisation claim.
#
# Why this file is not line-for-line identical to otel.yaml
# ---------------------------------------------------------
# The two agents model an event differently, so the same six operations are
# expressed with different amounts of work. The information added is identical;
# the cost of expressing it is not, and that cost is what the study measures.
#
#   Vector: an event is a document you reshape. Rename = one del() (take the
#   value, drop the old key); replacing the root costs nothing; nothing keeps a
#   copy of the original line. Optimised for transformation cost and memory.
#
#   OTel Collector: a log is a typed record (resource, scope, body, attributes,
#   timestamps, severity text AND number). There is no rename primitive, so a
#   rename is set + delete_key; enrichment goes into the separate attribute map,
#   which is a copy; body keeps the original line; the filelog receiver records
#   its source automatically. Optimised for interoperability and semantic fidelity.
#
# Consequences visible in the numbers: 13 statements here vs 23 there, no field
# copy here vs one there, severity stored once vs twice, ~19 MiB vs ~98 MiB per
# process. These are design consequences, not tuning choices or handicaps.
#
# Scope of the scenario
# ---------------------
# This models the file-tailing case: an uninstrumented or legacy source whose
# lines are collected and normalised by an agent, so per-event enrichment has to
# happen in the pipeline because the application cannot emit it. Scenarios where
# an OpenTelemetry SDK performs this work at emit time are out of scope.
# The corpus is CLF-shaped content delivered as NDJSON, which no single real
# source emits exactly; that is a declared limitation, not an oversight.
#
# Measurement path (identical on both arms)
# -----------------------------------------
# Same input file, same six host-metric collectors at a 15 s interval
# (cpu, memory, disk, network, filesystem, load), same discard sink with no disk
# buffer, same "no checkpoint, re-read from the beginning" durability.
# Neither arm configures a batch processor, so every record traverses the
# pipeline individually; no arm is advantaged by amortising work over a batch.
#
# Disclosed asymmetries, listed in one place rather than left in prose:
#   - self-telemetry: Vector snapshots internal_metrics every 5 s; the OTel
#     Collector is pulled by Prometheus at 15 s.
#   - source metadata: the OTel filelog receiver adds log.file.name to every
#     record automatically (a Development attribute). Vector keeps file metadata
#     outside the event document, so it adds no equivalent attribute.
#
# Deliberately excluded mappings
# ------------------------------
# `http.request.referrer` is not used: no such attribute exists in the semantic
# convention registry. `http.response.body.size` is not used: it is only
# Development, not Stable. `bytes` and `referer` are therefore left untouched in
# both arms rather than mapped to unstable targets.
#
# PII note
# --------
# Dropping user-identifier is representative of a compliance-driven deployment
# (GDPR Art. 5(1)(c) data minimisation). The corpus is synthetic, so this is
# practice being modelled, not a legal obligation on this data.
#
# This transform supersedes the parse-and-flag transform introduced in 1e844d2.
# Data produced before this revision (e.g. sweep-2026-10-18) was measured with
# the earlier transform and is not comparable with runs from this file.
#
# Pairing rule
# ------------
# Both arms must be measured from the same commit of this config pair. A new
# vector.yaml compared against an older otel.yaml run is not a comparison, it is
# two unrelated measurements.
#
# Sources for the basis column
# ----------------------------
# Logs Data Model     https://opentelemetry.io/docs/specs/otel/logs/data-model/
# semconv HTTP        https://opentelemetry.io/docs/specs/semconv/registry/attributes/http/
# semconv URL         https://opentelemetry.io/docs/specs/semconv/registry/attributes/url/
# semconv network     https://opentelemetry.io/docs/specs/semconv/registry/attributes/network/
# semconv client      https://opentelemetry.io/docs/specs/semconv/registry/attributes/client/
# semconv service     https://opentelemetry.io/docs/specs/semconv/resource/service/
# semconv deployment  https://opentelemetry.io/docs/specs/semconv/registry/attributes/deployment/
# RFC 9110 status     https://www.rfc-editor.org/rfc/rfc9110#name-status-codes
# GDPR Art. 5(1)(c)   https://eur-lex.europa.eu/eli/reg/2016/679/oj
# Log parsing context Zhu et al., ICSE-SEIP 2019, doi:10.1109/ICSE-SEIP.2019.00021
data_dir: /var/lib/vector
sources:
  logs:
    type: file
    include: ["/logs/bench.log"]
    read_from: beginning
    ignore_checkpoints: true
    # Per-file read slice, pinned to the granularity the OTel Collector uses by
    # default. max_read_bytes is not a buffer size: it is the amount Vector takes
    # from one file before moving to the next, a fairness control written for
    # fleets of files (the docs say it exists to spread reads evenly across them).
    # With a single file it becomes "take 2 KB, come straight back", and the
    # stock default of 2048 B is 8x smaller than the OTel Collector's documented
    # initial_buffer_size of 16 KiB, so the two arms did not start from the same
    # read granularity. Swept on the LXC at 5000 ev/s, 3 reps: 2048 -> 7.55 % of
    # one core, 8192 -> 6.93, 16384 -> 6.73, 32768 -> 6.68, 65536 -> 6.65, with
    # the OTel arm unchanged at 6.81 %. The curve plateaus at 16 KiB (92 % of the
    # gap closed), which is also the OTel Collector's documented default. No
    # statement in the transform changes; only how many bytes one read requests.
    max_read_bytes: 16384
  self:
    type: internal_metrics
    scrape_interval_secs: 5
  host:
    type: host_metrics
    scrape_interval_secs: 15
    collectors: [cpu, memory, disk, network, filesystem, load]
transforms:
  enrich:
    type: remap
    inputs: [logs]
    # drop_on_error: false - a line that fails the remap is passed through
    # unchanged rather than dropped, so a malformed record cannot silently
    # disappear. This mirrors error_mode: propagate on the OTel side: the failure
    # is surfaced instead of hidden. The corpus is valid JSON, so neither branch
    # fires during a run; the setting is kept explicit rather than left implicit.
    drop_on_error: false
    source: |
      # frame: replace the event root with the parsed record. Vector's timestamp
      # and source type live in the event metadata, not in the document.
      . = parse_json!(.message)

      # (0) instrumentation marker only - not a production attribute
      .processed = true

      # (1) event time: "02/Oct/2026:07:46:38 +0700" -> record Timestamp
      .timestamp = parse_timestamp!(to_string!(.datetime), format: "%d/%b/%Y:%H:%M:%S %z")
      del(.datetime)

      # (2) severity from the HTTP status class (RFC 9110 §15).
      #     The mapping is a study decision; the target field is OTel's.
      .severity = if to_int!(.status) >= 500 { "ERROR" } else if to_int!(.status) >= 400 { "WARN" } else { "INFO" }

      # (3) renames to Stable semantic-convention attributes.
      #     A rename is one del() here; OTTL needs set + delete_key.
      #     request -> url.path is exact for this corpus: 0 of the 5 000 records
      #     contain a "?". With a query string the correct pair would be the
      #     url.path + url.query split.
      ."http.request.method" = del(.method)
      ."url.path" = del(.request)
      ."http.response.status_code" = del(.status)
      # registry wants the version alone: HTTP/2.0 -> 2.0
      ."network.protocol.version" = replace(del(.protocol), pattern: "HTTP/", with: "") ?? ""

      # (4) client address: `host` is the client in CLF-style access logs
      ."client.address" = del(.host)

      # (5) data minimisation: drop the user identity at the pipeline
      del(."user-identifier")

      # (6) static context. Resource-level in production; applied per record
      #     here so both arms pay the same work.
      ."deployment.environment.name" = "production"
      ."service.name" = "bench"
sinks:
  discard:
    type: blackhole
    inputs: [enrich]
    print_interval_secs: 0
  metrics:
    type: prometheus_exporter
    inputs: [host, self]
    address: "0.0.0.0:9598"
